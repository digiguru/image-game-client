name: issue 55 migration validation

on:
  push:
    branches:
      - fix/issue-55-security-tooling

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-55-security-tooling

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Check removed Babel and glob ancestry
        run: |
          if npm ls @babel/core babel-jest jest glob --all 2>/dev/null | grep -E '@babel/core|babel-jest|jest@|glob@10\.5\.0'; then
            echo 'Obsolete Babel/Jest or glob@10.5.0 ancestry remains'
            exit 1
          fi
          echo 'No obsolete Babel/Jest or glob@10.5.0 ancestry found'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "Regenerate lockfile for issue 55"
            git push origin HEAD:fix/issue-55-security-tooling
          fi
