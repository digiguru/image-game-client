name: Stage 8 accessibility dependency

on:
  push:
    branches: [agent/stage-8-accessibility-ui]

permissions:
  contents: write

jobs:
  update-dependency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/stage-8-accessibility-ui
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --save-dev @axe-core/playwright
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add Playwright accessibility auditing"
            git push
          fi
